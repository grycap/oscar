name: mkdocs Master Push

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      confirm_execution:
        description: 'Do you want to execute this workflow?'
        required: true
        type: boolean
        default: false

jobs:

  deploy:
    if: ${{ inputs.confirm_execution }}
    uses: ./.github/workflows/mkdocs_common.yaml
    permissions:
      contents: write
    with: {}
